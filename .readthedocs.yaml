version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt
    # Install your package but WITHOUT heavy runtime deps
    # (avoids failing on pylibCZIrw etc. during doc build)
    - method: pip
      path: .
      extra_requirements:
        - docs